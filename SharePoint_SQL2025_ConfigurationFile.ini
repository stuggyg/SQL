;================================================================================
; SQL Server 2025 - Unattended Install Configuration
; Purpose : Database backend for SharePoint Server Subscription Edition (SPSE)
; Applies : Run on a dedicated SQL host. For an Always On AG pair, run this
;           SAME file on each replica (collation + paths MUST match), then
;           build the WSFC cluster and Availability Group afterwards.
;
; Usage   : setup.exe /ConfigurationFile=SharePoint_SQL2025_ConfigurationFile.ini
;           Passwords are intentionally NOT stored here. Supply at the prompt or
;           pass on the command line, e.g.:
;           setup.exe /ConfigurationFile=...ini ^
;             /SQLSVCPASSWORD="***" /AGTSVCPASSWORD="***" /SAPWD="***" /IACCEPTSQLSERVERLICENSETERMS
;
; NOTE    : Replace every <PLACEHOLDER> before running. Review every drive path
;           against your actual disk layout.
;================================================================================

[OPTIONS]

;--- Core action -----------------------------------------------------------------
ACTION="Install"
IACCEPTSQLSERVERLICENSETERMS="True"
SUPPRESSPRIVACYSTATEMENTNOTICE="True"
ENU="True"
QUIET="True"                        ; fully silent. Use QUIETSIMPLE="True" instead if you want the UI progress bar.
UpdateEnabled="True"                ; pull latest setup update/CU during install
UpdateSource="MU"

;--- Features --------------------------------------------------------------------
; SharePoint only needs the Database Engine (Full-Text is part of SQLENGINE now).
; Add AnalysisServices (AS) ONLY if you run PerformancePoint / Project Server cubes.
FEATURES=SQLENGINE

;--- Instance --------------------------------------------------------------------
; Default instance (MSSQLSERVER) is simplest for SharePoint. Use a named instance
; only if you have a reason to; if you do, you must set a static port + SPN.
INSTANCENAME="MSSQLSERVER"
INSTANCEID="MSSQLSERVER"

;--- Collation -- CRITICAL FOR SHAREPOINT ---------------------------------------
; SharePoint databases REQUIRE this collation. Setting it at the instance level
; ensures new SharePoint DBs and TempDB inherit it. Must be identical on all AG replicas.
SQLCOLLATION="Latin1_General_CI_AS_KS_WS"

;--- Service accounts (use DOMAIN accounts, never Local System) -------------------
; Grant these least-privilege domain service accounts. Passwords passed at runtime.
SQLSVCACCOUNT="<DOMAIN>\svc-sql-engine"
SQLSVCSTARTUPTYPE="Automatic"
AGTSVCACCOUNT="<DOMAIN>\svc-sql-agent"
AGTSVCSTARTUPTYPE="Automatic"

;--- Instant File Initialization (perform volume maintenance tasks) --------------
; Grants SE_MANAGE_VOLUME_NAME to the engine account -> instant data file growth.
; Big win for autogrowth / restores. (Log files are always zeroed regardless.)
SQLSVCINSTANTFILEINIT="True"

;--- sysadmins -------------------------------------------------------------------
; Add the SharePoint setup/farm admin and your DBA group. The SharePoint setup
; account needs dbcreator + securityadmin at minimum; sysadmin during farm build
; is common, then trim back per your security policy.
SQLSYSADMINACCOUNTS="<DOMAIN>\SQL-DBA-Admins" "<DOMAIN>\svc-sp-setup"

;--- Security mode ---------------------------------------------------------------
; Windows-only auth is best practice for SharePoint (it uses integrated auth).
; If you must enable Mixed Mode, set SECURITYMODE="SQL" and supply /SAPWD at runtime.
; SECURITYMODE="SQL"

;================================================================================
; PERFORMANCE TUNING (set at install so no post-config drift)
;================================================================================

;--- MAXDOP = 1 -- CRITICAL FOR SHAREPOINT --------------------------------------
; Microsoft mandates MAXDOP 1 for all instances serving SharePoint. Default
; parallelism causes CXPACKET waits and unsupported behaviour. Set here at install.
SQLMAXDOP="1"

;--- Server memory (MB) ----------------------------------------------------------
; Cap max so the OS + SharePoint timer/search (if colocated) aren't starved.
; Rule of thumb on a DEDICATED SQL box: leave ~10-20% (min 4 GB) for the OS.
; Examples:  32 GB RAM -> ~26624   |   64 GB -> ~57344   |   128 GB -> ~116736
; Adjust to YOUR RAM. Do not leave SQL at the unlimited default.
SQLMINMEMORY="0"
SQLMAXMEMORY="<MAX_MB>"

;================================================================================
; TEMPDB  (SharePoint search/crawl + content churn hit TempDB hard)
;================================================================================
; File count: 1 per logical core, capped at 8. E.g. 8 cores -> 8. Set to your cores (<=8).
SQLTEMPDBFILECOUNT="8"
SQLTEMPDBFILESIZE="1024"            ; MB per data file (pre-size; avoid autogrowth thrash)
SQLTEMPDBFILEGROWTH="256"           ; MB growth per file
SQLTEMPDBLOGFILESIZE="1024"         ; MB TempDB log
SQLTEMPDBLOGFILEGROWTH="256"        ; MB

;================================================================================
; DISK LAYOUT  (separate spindles/volumes; SSD/NVMe strongly recommended)
;================================================================================
INSTALLSQLDATADIR="E:\MSSQL\System"       ; system DBs (master/model/msdb)
SQLUSERDBDIR="F:\MSSQL\Data"              ; SharePoint content/config data files (.mdf/.ndf)
SQLUSERDBLOGDIR="G:\MSSQL\Log"           ; transaction logs (dedicated volume)
SQLTEMPDBDIR="H:\MSSQL\TempDBData"       ; TempDB data (fast/local NVMe ideal)
SQLTEMPDBLOGDIR="H:\MSSQL\TempDBLog"     ; TempDB log
SQLBACKUPDIR="J:\MSSQL\Backup"           ; backups

;================================================================================
; NETWORK / PROTOCOLS
;================================================================================
TCPENABLED="1"                      ; SharePoint connects over TCP/IP - required
NPENABLED="0"                       ; Named Pipes off unless you specifically need it
FILESTREAMLEVEL="0"                 ; leave 0 unless using RBS/FILESTREAM for BLOB offload
